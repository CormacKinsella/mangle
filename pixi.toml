[workspace]
authors = ["CormacKinsella <27350062+CormacKinsella@users.noreply.github.com>"]
channels = ["conda-forge", "bioconda"]
name = "mangle"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
rust = ">=1.100.0,<1.101"
bcftools = ">=1.25,<2"
dnadotplot = ">=0.1.4,<0.2"
cargo-audit = ">=0.22.1,<0.23"

[tasks]
build = "cargo build --release"
test = "cargo test"
audit = "cargo audit"
mangle = { cmd = "target/release/mangle", depends-on = ["build"], description = "Build if needed, then run mangle. Usage: pixi run mangle -s <spec.tsv> <input.fasta>" }

[tasks.plotspecific]
cmd = "dnadotplot --revcompl --window {{ window_size }} -o {{ output }} -1 {{ input1 }} -2 {{ input2 }}"
args = [
    { arg = "input1" },
    { arg = "input2" },
    { arg = "output" },
    { arg = "window_size", default = "7" }
]
description = "Dotplot of two mangle products (one sequence each; a multi-record file only plots its first record). Usage: pixi run dotplot <input1.fa> <input2.fa> <output.png> [window_size], e.g. pixi run plotspecific outputs/original.fa outputs/var1.fa dotplot.png"

[tasks.plots]
cmd = "bash scripts/dotplot_all.sh {{ input_dir }} {{ output_dir }} {{ window_size }}"
args = [
    { arg = "input_dir", default = "outputs" },
    { arg = "output_dir", default = "plots" },
    { arg = "window_size", default = "7" }
]
description = "All pairwise dotplots between the product fastas in a mangle output dir (all.fa skipped). Usage: pixi run plots [input_dir=outputs] [output_dir=plots] [window_size=7]; writes <A>_vs_<B>.png"
